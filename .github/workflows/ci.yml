name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Instala Fastlane
        run: gem install fastlane

      - name: Selecciona Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Corre tests
        run: fastlane test

      - name: Sube reporte de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: fastlane/test_output/
